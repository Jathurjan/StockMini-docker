services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_KEY: base64:eVNOrtMb5Oa8bIcjYWKgyTV3Pq0aRT2gMVpctbKtRJE=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: stockmini
      DB_USERNAME: stockmini_user
      DB_PASSWORD: stockmini_pass

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockmini
      MYSQL_USER: stockmini_user
      MYSQL_PASSWORD: stockmini_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: